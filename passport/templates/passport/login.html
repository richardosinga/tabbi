{% extends "plans/base.html" %}
{% block title %}Unlock — {{ passport.title }}{% endblock %}
{% block content %}
<style>
.pp-wrap { max-width: 480px; margin: 64px auto; padding: 0 24px; }
.pp-card {
  background: #fff;
  border: 2.5px solid #180A0A;
  border-radius: 16px;
  box-shadow: 4px 4px 0 #180A0A;
  padding: 48px;
}
.pp-card h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: #180A0A; }
.pp-card .subtitle { color: #535050; margin-bottom: 32px; }
.pp-field { margin-bottom: 20px; }
.pp-field label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
.pp-field input[type=text] {
  width: 100%; padding: 12px 16px;
  border: 2px solid #DCDCDC; border-radius: 8px;
  font-size: 1rem; font-family: inherit; background: #fff;
  box-sizing: border-box;
}
.pp-field input[type=text]:focus { outline: none; border-color: #e7a328; }
.pp-btn {
  width: 100%; padding: 14px;
  background: #e7a328; color: #180A0A;
  border: 2.5px solid #180A0A; border-radius: 8px;
  box-shadow: 3px 3px 0 #180A0A;
  font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px;
  font-family: inherit;
}
.pp-btn:hover { background: #c8891a; }
.pp-error { color: #c0392b; font-size: .9rem; margin-bottom: 16px; padding: 10px 14px; background: #fdf0ef; border-radius: 6px; }
.lock-icon { font-size: 2.5rem; margin-bottom: 16px; display: block; }
</style>
<div class="pp-wrap">
  <div class="pp-card">
    <span class="lock-icon">🔒</span>
    <h1>{{ passport.title }}</h1>
    <p class="subtitle">Enter your passphrase to open this passport.</p>

    {% if error %}<p class="pp-error">{{ error }}</p>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="pp-field">
        <label for="phrase">Passphrase</label>
        <input type="text" id="phrase" name="phrase" autofocus autocomplete="off" placeholder="e.g. amber glacier market wolf">
      </div>
      <button type="submit" class="pp-btn">Unlock &rarr;</button>
    </form>
  </div>
</div>
{% endblock %}
